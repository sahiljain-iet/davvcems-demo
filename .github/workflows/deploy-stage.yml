name: Deploy to Staging
on:
  push:
    branches: [dev]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Backup Current Deployment
        run: |
          mkdir -p /tmp/davvcems-stage/backups
          cp -r scripts /tmp/davvcems-stage/backups/$(date +%F_%H-%M-%S) || true
          echo "Backup created at /tmp/davvcems-stage/backups"
      - name: Deploy to Staging
        run: |
          mkdir -p /tmp/davvcems-stage/deployment
          cp -r scripts/* /tmp/davvcems-stage/deployment/
          bash /tmp/davvcems-stage/deployment/deploy.sh
          echo "Deployed to staging at /tmp/davvcems-stage/deployment"
      - name: Verify Deployment
        run: |
          ping -c 4 google.com || echo "Staging verification failed at $(date)" >> /tmp/davvcems-stage/verify.log
        continue-on-error: true
      - name: Rollback on Failure
        if: failure()
        run: |
          rm -rf /tmp/davvcems-stage/deployment
          cp -r /tmp/davvcems-stage/backups/$(ls -t /tmp/davvcems-stage/backups | head -n 1) /tmp/davvcems-stage/deployment
          echo "Rollback triggered for commit ${{ github.sha }} at $(date)" >> /tmp/davvcems-stage/rollback.log
      - name: Notify on Failure
        if: failure()
        run: |
          echo "🚨 Staging Deployment Failed for commit ${{ github.sha }}! Rollback executed. Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> /tmp/davvcems-stage/notification.log
      - name: Clean Up Old Backups
        if: success()
        run: |
          find /tmp/davvcems-stage/backups -name "*" -type d -mtime +7 -exec rm -rf {} \; 2>/dev/null || true
          echo "Cleaned up old staging backups"